<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!--
      Galeria de desenvolvimento dos tokens e primitivos (R1): http://localhost:5173/ui.html.
      O Vite serve qualquer .html da raiz em dev; o build só empacota o index.html, então esta
      página não vai para produção.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Fields' — galeria de UI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Mesmo script de tema do index.html (e mesma regra de src/theme/theme.js). -->
    <script>
      (function () {
        var raiz = document.documentElement;
        var preferencia = "light";
        try {
          var salva = window.localStorage.getItem("fields.tema");
          if (salva === "light" || salva === "dark" || salva === "system") preferencia = salva;
        } catch (e) {
          /* storage bloqueado: segue no padrão */
        }
        var tema = preferencia;
        if (preferencia === "system") {
          try {
            tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch (e) {
            tema = "light";
          }
        }
        raiz.dataset.theme = tema;
        raiz.dataset.temaPreferencia = preferencia;
        raiz.style.colorScheme = tema;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="galeria"></div>
    <script type="module" src="/src/ui/galeria-main.jsx"></script>
  </body>
</html>
